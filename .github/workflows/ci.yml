name: CI

# ═══════════════════════════════════════════════════════════════
# 设计原则（ENGINEERING.md 第五节：禁止非必要门禁）
#
# 只设「拦得下真错」的检查，且每条都要能说出拦过什么。
# 配置前的实测结论：
#   全项目 141 个 ruff 问题中，真正会崩的是 0 个
#   （F821 未定义名 0 / F811 重复定义 0 / E722 裸except 0）
# 「全量ruff」是典型的非必要门禁 —— 只会一直红，从不拦真错。
# 故按 ENGINEERING 第五节收敛为 5 项，每项都有事故记录。
#
# 依赖数据的检查（audit_data_quality / check_units）**不在 CI 跑** ——
# data/ 与 runtime/ 都在 .gitignore，CI 上无 market.db、无 Tushare 数据。
# 硬跑必然失败，那是「设计失效的门禁」，不是有效门禁。
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新 push 取消旧 run，避免队列堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本workflow 只需读，不写代码、不创建 issue
permissions:
  contents: read

jobs:
  ci:
    name: 静态检查与结构校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Python 版本必须与本地一致：3.12
      # （<3.13 是依赖链硬约束，peewee 3.17.3 在 3.13 下构建失败）
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # ruff 已在 uv.lock 中锁定（dev 依赖），一步装齐
      - name: 同步依赖
        run: uv sync --frozen --extra dev

      # ── 检查 1：未使用变量（F841）──
      # 拦下过：merge_tushare_into_db.py:83 的 adj_i
      #         （建了 set_index 却从未查询，典型的「以为用了其实没」）
      - name: 检查未使用变量
        run: |
          echo "F841 —— 赋值但未使用，常是漏写/漏改的痕迹"
          uv run ruff check src/ research/ --select F841 --output-format=github

      # ── 检查 2：脚本 import 链──
      # 拦下过：joblib 未在 pyproject.toml 声明，
      #         重建 venv 后 4 个研究脚本连锁 ModuleNotFoundError。
      # ⚠️ 这项检查要求 src/factor_lab/data/ 必须入库。
      #    曾因 .gitignore 写 `data/`（未锚定）导致它被忽略，
      #    干净克隆下 10 个脚本全部失败 —— 详见 PITFALLS P20。
      - name: 验证所有脚本可导入
        run: |
          echo "验证 34 个脚本的 import 链"
          uv run python research/scripts/verify_imports.py

      # ── 检查 3：文件行数上限（用户明确要求）──
      # 拦下过：AGENTS.md 曾 579 行、config.py 曾硬编码绝对路径。
      - name: 检查文件行数上限
        run: |
          echo "代码文件 ≤ 500 行（文档与生成物天然不在此glob 内，无需豁免）"
          uv run python - <<'PYEOF'
          import subprocess

          LIMIT = 500
          FORCED_SPLIT = 400

          # -z 用 NUL 分隔，正确处理含中文的路径
          #（不带 -z 时 git会给非ASCII 路径加引号，Path() 会崩）
          raw = subprocess.run(
              ["git", "ls-files", "-z", "*.py", "*.sh", "*.toml", "*.sql"],
              capture_output=True, check=True).stdout
          files = [f for f in raw.decode("utf-8").split("\0") if f]

          over, warn = [], []
          for f in files:
              n = len(open(f, encoding="utf-8", errors="replace").read().splitlines())
              if n > LIMIT:
                  over.append((n, f))
              elif n > FORCED_SPLIT:
                  warn.append((n, f))

          if warn:
              print(f"⚠️ 强制拆分区（{FORCED_SPLIT}~{LIMIT} 行），触碰时需同时降下来：")
              for n, f in sorted(warn, reverse=True):
                  print(f"   {n:>4}  {f}")

          if over:
              print(f"\n✗ 超过 {LIMIT} 行上限：")
              for n, f in sorted(over, reverse=True):
                  print(f"   {n:>4}  {f}（超 {n - LIMIT} 行）")
              raise SystemExit(1)

          print(f"✓ 全部 {len(files)} 个受检文件均 ≤ {LIMIT} 行")
          PYEOF

      # ── 检查 4：单元测试 ──
      # 拦下过：tests/ 目录声明在 pyproject 的 testpaths 里但**根本不存在**，
      #         pytest 从未真正跑过（uv run pytest 报 program not found），
      #         导致 market_rules 的「理论最大容差」文档数字与代码实测
      #         相差 0.47~2.3pp，长时间无人发现。
      # 这项检查同时守住「新增判据逻辑必须有边界测试」。
      - name: 运行单元测试
        run: |
          echo "pytest（market_rules 判据边界，每次改动都要重跑）"
          uv run pytest tests/ -q

      # ── 检查 5：git 提交身份 ──
      # 拦下过：40 个提交被 WorkBuddy <workbuddy@local> 污染。
      #⚠️ 只查 author，不查 committer：
      #    squash 合并时 GitHub 会把 committer 填成它自己
      #    （GitHub <noreply@github.com>），这是正常行为，不该拦。
      #    实测 3 个 squash 提交都是 author 正确、committer 为 GitHub。
      # ⚠️ 只覆盖本次 checkout 的提交（fetch-depth: 1 默认浅克隆），
      #    作用是拦住「新提交身份不对」，不是审计全部历史。
      - name: 校验提交作者身份
        run: |
          echo "作者邮箱须为 2020621056@qq.com"
          echo "（曾有 40 个提交被 WorkBuddy <workbuddy@local> 污染）"
          BAD=$(git log --format='%ae' | sort -u \
                | grep -v -x '2020621056@qq.com' || true)
          if [ -n "$BAD" ]; then
            echo "✗ 发现非预期作者邮箱："
            echo "$BAD"
            echo ""
            echo "修复：uv run python research/scripts/rewrite_authors.py \\"
            echo "  --old-name <旧名> --old-email <旧邮箱> \\"
            echo "  --new-name enlia --new-email 2020621056@qq.com"
            exit 1
          fi
          echo "✓ 全部提交作者正确"
